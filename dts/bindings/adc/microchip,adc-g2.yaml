description: |
  Binding for the Microchip ADC driver supporting Group G2 peripherals.

  Group G2 ADC driver supports the following hardware peripheral:
    - module name="ADC" id="02508" version="1.0.0"

compatible: "microchip,adc-g2"

include:
  - name: adc-controller.yaml
  - name: pinctrl-device.yaml

properties:
  reg:
    required: true
    description: |
      Register base address and size for the ADC peripheral.

  interrupts:
    required: true
    description: |
      Interrupt specifier for the ADC peripheral.

  adcsel:
    type: string
    required: true
    enum:
      - "pbclk"
      - "frc"
      - "refclk3"
      - "sysclk"
    default: "pbclk"
    description: Analog-to-Digital Clock Source (TCLK)

  vref-mv:
    type: int
    description: |
      ADC reference voltage in millivolts.

      This should match the reference selected in hardware or software config.

  conclkdiv:
    type: int
    required: true
    description: |
      Analog-to-Digital Control Clock (TQ) Divider value. Must be between 1 and 64 inclusive.

      The ADC clock is derived by dividing the source clock by this conclkdiv.

  adcdiv:
    type: int
    required: true
    description: |
      Division Ratio for the Shared SAR ADC Core Clock. Must be a multiples of 2 between 2 and 254
      inclusive.

      The shared SAR ADC core clock is derived by dividing the ADC clock by this adcdiv.

  num-channels:
    type: int
    required: true
    default: 8
    description: |
      Number of input channels supported by this ADC instance.

  "#io-channel-cells":
    const: 1
    description: |
      Specifies that each io-channel uses a single cell (input index).

  fract:
    type: string
    required: true
    enum:
      - "integer"
      - "fractional"
    description: |
      Fractional Data Output Format.

  sign:
    type: boolean
    description: |
      Using signed Data Output mode.

io-channel-cells:
  - input
