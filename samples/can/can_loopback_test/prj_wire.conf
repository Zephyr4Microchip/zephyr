# Wire Presence Test Configuration
# Used when a physical wire is connected between PA8 and PA9.
#
# How it works:
#   TC0 (GPIO wire test):
#     PA8 (CAN0_TX, already func=gpio in pinctrl) driven as output
#     PA9 (CAN0_RX, already func=gpio in pinctrl) read as input
#     Wire PA8->PA9 required for TC0 to PASS
#   TC1-TC6 (CAN tests):
#     Run in M_CAN internal loopback (same as prj.conf) — always work
#
# Board : pic32wm_bz6204_curiosity
# Wire  : PA8 (CAN0_TX) → PA9 (CAN0_RX)   [use a jumper wire]
#
# Why PA8/PA9 and not PA3/PA2 (CAN1)?
#   CAN0 pins use func=gpio in pinctrl (ENHANCED_CAN dedicated function)
#   so they are already in plain digital GPIO mode — no mode switch needed.
#   CAN1 pins use PPS peripheral mode and cannot be easily toggled as GPIO.

CONFIG_CAN=y

# Enable external wire loopback mode
CONFIG_CAN_WIRE_TEST=y

# Console
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_MODE_IMMEDIATE=y

# GPIO for LED
CONFIG_GPIO=y

# Stack
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=512
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=128000000
