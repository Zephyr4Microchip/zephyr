# CAN Internal Loopback Validation Test — PIC32 BZ6204 Curiosity
# No external transceiver required; uses M_CAN hardware internal loopback.

# CAN subsystem
CONFIG_CAN=y
CONFIG_CAN_LOG_LEVEL_DBG=y

# Console (UART via PKOB4 virtual COM port — polling mode avoids UART ISR conflicts)
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=3
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_MODE_IMMEDIATE=y

# GPIO for LED pass/fail indication
CONFIG_GPIO=y

# Stack - can_mcan_send has large local structs; LOG_MODE_IMMEDIATE needs printf space
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=512

# Timing
CONFIG_SYS_CLOCK_HW_CYCLES_PER_SEC=128000000
