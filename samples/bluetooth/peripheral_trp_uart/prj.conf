# Bluetooth core
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_SMP=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_DEVICE_NAME="Microchip"
CONFIG_BT_MAX_CONN=1

# BT buffer sizing
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=255
CONFIG_BT_RX_STACK_SIZE=2048

# Persistent settings (bond storage)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Net buf (required by TRS server)
CONFIG_NET_BUF=y

# System work queue
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Logging
CONFIG_LOG=y

# TRS service + server profile layers
CONFIG_BT_TRS=y
CONFIG_BT_TRS_SERVER=y

# TRS server tuning (override subsys defaults if needed)
CONFIG_TRS_SERVER_CREDIT=16
CONFIG_TRS_SERVER_BUF_POOL_SIZE=16
CONFIG_TRS_SERVER_BUF_DATA_SIZE=244
